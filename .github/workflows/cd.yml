name: CD — Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy-client:
    name: Deploy Client → Vercel
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_CLIENT }}
          working-directory: client
          vercel-args: '--prod'

  deploy-server:
    name: Deploy Server → Railway
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --service server
        working-directory: server
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  notify:
    name: Notify Deploy Success
    runs-on: ubuntu-latest
    needs: [deploy-client, deploy-server]
    if: success()

    steps:
      - name: Create deployment summary
        run: |
          echo "## ✅ Deploy completed successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Client:** Vercel" >> $GITHUB_STEP_SUMMARY
          echo "- **Server:** Railway" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **By:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
